apiVersion: v1
kind: List
items:
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: app-1
      namespace: default
      annotations:
        nginx.ingress.kubernetes.io/enable-cors: "true"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    spec:
      ingressClassName: nginx
      tls:
        - hosts:
            - app1.example.com
          secretName: app1-tls
      rules:
        - host: app1.example.com
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: app1-svc
                    port:
                      number: 80
  - apiVersion: v1
    kind: Service
    metadata:
      name: app1-svc
      namespace: default
    spec:
      selector:
        app: app1
      ports:
        - port: 80
          targetPort: 8080
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: app-2
      namespace: default
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /$2
        nginx.ingress.kubernetes.io/limit-rps: "100"
    spec:
      ingressClassName: nginx
      rules:
        - host: app2.example.com
          http:
            paths:
              - path: /api(/|$)(.*)
                pathType: ImplementationSpecific
                backend:
                  service:
                    name: app2-svc
                    port:
                      number: 8080
