# Step 2: 创建 ApisixPluginConfig（启用 proxy-cookie-flags 插件）
apiVersion: apisix.apache.org/v2
kind: ApisixPluginConfig
metadata:
  name: cookie-flags-config
  namespace: default
spec:
  ingressClassName: apisix
  plugins:
    - name: proxy-cookie-flags
      enable: true
      config:
        rules:
          - match: "sessionid"
            flags: ["SameSite=None", "Secure"]
          - match: "auth_token"
            flags: ["HttpOnly", "Secure"]
          - match: "*"
            flags: ["SameSite=Lax"]
---
# Step 3: 创建 Ingress，引用 ApisixPluginConfig
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cookie-test
  namespace: default
  annotations:
    k8s.apisix.apache.org/plugin-config-name: cookie-flags-config
spec:
  ingressClassName: apisix
  rules:
    - host: cookie.test.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cookie-backend
                port:
                  number: 80
